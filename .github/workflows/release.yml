# Push a tag like v1.1.3 (matching __version__ in hard2gesture/__init__.py) to build the
# installer and publish it as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check that the tag matches the app's version
        run: |
          $version = python -c "import hard2gesture; print(hard2gesture.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match version $version" }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        run: powershell -ExecutionPolicy Bypass -File installer\build.ps1
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem dist\Hard2Gesture-Setup-*.exe).FullName
          gh release create "${{ github.ref_name }}" $installer --title "Hard2Gesture ${{ github.ref_name }}" --generate-notes
